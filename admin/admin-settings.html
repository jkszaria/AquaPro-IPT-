<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaPro - Settings</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Admin Sidebar -->
        <aside class="sidebar admin-sidebar">
            <div class="sidebar-header">
                <i class="fas fa-water"></i>
                <span>AquaPro Admin</span>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="admin.html"><i class="fas fa-th-large"></i><span>Dashboard</span></a></li>
                    <li><a href="admin-orders.html"><i class="fas fa-clipboard-list"></i><span>Orders</span></a></li>
                    <li><a href="delivery-management.html"><i class="fas fa-truck"></i><span>Deliveries</span></a></li>
                    <li><a href="admin-drivers.html"><i class="fas fa-users"></i><span>Drivers</span></a></li>
                    <li><a href="admin-customers.html"><i class="fas fa-address-book"></i><span>Customers</span></a></li>
                    <li><a href="inventory.html"><i class="fas fa-boxes"></i><span>Inventory</span></a></li>
                    <li><a href="admin-reports.html"><i class="fas fa-chart-bar"></i><span>Reports</span></a></li>
                    <li class="active"><a href="admin-settings.html"><i class="fas fa-cog"></i><span>Settings</span></a></li>
                    <li class="logout-item"><a href="../login.html"><i class="fas fa-sign-out-alt"></i><span>Logout</span></a></li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content admin-main">
            <header class="admin-header">
                <div class="header-left">
                    <h1>Settings</h1>
                    <p>Configure your AquaPro system</p>
                </div>
            </header>

            <div class="settings-container">
                <!-- Station Profile -->
                <div class="card">
                    <div class="card-header"><h3><i class="fas fa-store"></i> Station Profile</h3></div>
                    <div class="card-body">
                        <div class="form-group">
                            <label>Station Name</label>
                            <input type="text" value="Aqua Fresh Station" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Station Address</label>
                            <input type="text" value="123 Main St., Catarman, Northern Samar" class="form-control">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Contact Number</label>
                                <input type="text" value="(055) 123-4567" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" value="aquafresh@aquapro.ph" class="form-control">
                            </div>
                        </div>
                        <button class="btn btn-primary">Save Changes</button>
                    </div>
                </div>

                <!-- Delivery Settings -->
                <div class="card">
                    <div class="card-header"><h3><i class="fas fa-truck"></i> Delivery Settings</h3></div>
                    <div class="card-body">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Default Delivery Fee</label>
                                <input type="number" value="20" class="form-control" step="0.01">
                            </div>
                            <div class="form-group">
                                <label>Max Delivery Distance (km)</label>
                                <input type="number" value="10" class="form-control">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Delivery Time Slots</label>
                            <div class="checkbox-group">
                                <label><input type="checkbox" checked> Morning (8:00 AM - 12:00 PM)</label>
                                <label><input type="checkbox" checked> Afternoon (12:00 PM - 5:00 PM)</label>
                            </div>
                        </div>
                        <button class="btn btn-primary">Save Changes</button>
                    </div>
                </div>

                <!-- Notification Settings -->
                <div class="card">
                    <div class="card-header"><h3><i class="fas fa-bell"></i> Notification Settings</h3></div>
                    <div class="card-body">
                        <div class="form-group">
                            <label class="toggle-switch">
                                <input type="checkbox" checked>
                                <span>Email notifications for new orders</span>
                            </label>
                        </div>
                        <div class="form-group">
                            <label class="toggle-switch">
                                <input type="checkbox" checked>
                                <span>SMS alerts for low stock</span>
                            </label>
                        </div>
                        <div class="form-group">
                            <label class="toggle-switch">
                                <input type="checkbox">
                                <span>Daily summary reports</span>
                            </label>
                        </div>
                        <button class="btn btn-primary">Save Changes</button>
                    </div>
                </div>

                <!-- Admin Account -->
                <div class="card">
                    <div class="card-header"><h3><i class="fas fa-user-shield"></i> Admin Account</h3></div>
                    <div class="card-body">
                        <div class="form-group">
                            <label>Admin Name</label>
                            <input type="text" value="Maria Santos" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" value="admin@aquapro.ph" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Change Password</label>
                            <input type="password" placeholder="New password" class="form-control">
                        </div>
                        <button class="btn btn-primary">Update Account</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/store.js"></script>
    <script src="../js/admin-settings.js"></script>
</body>
</html>
